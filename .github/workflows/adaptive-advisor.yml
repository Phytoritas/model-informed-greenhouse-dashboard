name: adaptive-advisor-graph

on:
  pull_request:
    paths:
      - "src/model_informed_greenhouse_dashboard/backend/app/adaptive_main.py"
      - "src/model_informed_greenhouse_dashboard/backend/app/services/adaptive_advisor/**"
      - "tests/test_adaptive_*.py"
      - "tests/test_operations_calendar.py"
      - "tests/test_server_telemetry_store.py"
      - "tests/test_market_supply_shock*.py"
      - "tests/test_routing_regression*.py"
      - "tests/test_quality_calibration.py"
      - "tests/test_runtime_lane_cache.py"
      - "frontend/src/components/advisor/AdaptiveAdvisorWorkbench.tsx"
      - "frontend/src/components/advisor/AdvisorQualityProfilePanel*"
      - "frontend/src/hooks/useAdaptiveAdvisor.ts"
      - "frontend/src/pages/assistant-route-page.tsx"
      - "frontend/src/utils/adaptiveHistory*"
      - ".github/workflows/adaptive-advisor.yml"
  push:
    branches:
      - "feat/adaptive-advisor-graph-v1"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
      - uses: snok/install-poetry@v1
        with:
          version: "2.1.3"
          virtualenvs-in-project: true
      - run: poetry install
      - name: Adaptive advisor hardening regression suite
        run: >-
          poetry run pytest -q
          tests/test_adaptive_planner.py
          tests/test_adaptive_change_detection.py
          tests/test_operations_calendar.py
          tests/test_server_telemetry_store.py
          tests/test_adaptive_snapshot_resolution.py
          tests/test_adaptive_conversation_store.py
          tests/test_adaptive_numeric_claims.py
          tests/test_runtime_lane_cache.py
          tests/test_market_supply_shock.py
          tests/test_market_supply_shock_guardrails.py
          tests/test_routing_regression.py
          tests/test_routing_regression_guardrails.py
          tests/test_quality_calibration.py
          tests/test_adaptive_executor.py
          tests/test_adaptive_runtime_hardening.py
      - name: Import adaptive ASGI and durable endpoints
        run: >-
          poetry run python -c
          "from model_informed_greenhouse_dashboard.backend.app.adaptive_main import app;
          paths={getattr(r,'path','') for r in app.routes};
          required={
          '/api/advisor/adaptive/execute',
          '/api/advisor/adaptive/telemetry/ingest',
          '/api/advisor/adaptive/market/observations',
          '/api/advisor/adaptive/feedback',
          '/api/advisor/adaptive/outcomes',
          '/api/advisor/adaptive/quality-calibration',
          '/api/advisor/adaptive/routing-regression',
          '/api/advisor/adaptive/threads/{thread_id}'};
          assert required <= paths, sorted(required-paths)"
      - name: Compile adaptive backend
        run: >-
          poetry run python -m compileall -q
          src/model_informed_greenhouse_dashboard/backend/app/services/adaptive_advisor
          src/model_informed_greenhouse_dashboard/backend/app/adaptive_main.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Adaptive advisor frontend tests
        run: >-
          npm test --prefix frontend --
          src/components/advisor/AdvisorQualityProfilePanel.test.tsx
          src/utils/adaptiveHistory.test.ts
      - run: npm run build --prefix frontend
