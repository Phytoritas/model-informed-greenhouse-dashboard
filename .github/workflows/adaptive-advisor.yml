name: adaptive-advisor-graph

on:
  pull_request:
    paths:
      - "src/model_informed_greenhouse_dashboard/backend/app/adaptive_main.py"
      - "src/model_informed_greenhouse_dashboard/backend/app/services/adaptive_advisor/**"
      - "tests/test_adaptive_*.py"
      - "tests/test_operations_calendar.py"
      - "frontend/src/components/advisor/AdaptiveAdvisorWorkbench.tsx"
      - "frontend/src/components/advisor/AdvisorQualityProfilePanel*"
      - "frontend/src/hooks/useAdaptiveAdvisor.ts"
      - "frontend/src/pages/assistant-route-page.tsx"
      - ".github/workflows/adaptive-advisor.yml"
  push:
    branches:
      - "feat/adaptive-advisor-graph-v1"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
      - uses: snok/install-poetry@v1
        with:
          version: "2.1.3"
          virtualenvs-in-project: true
      - run: poetry install
      - name: Adaptive advisor tests
        run: >-
          poetry run pytest -q
          tests/test_adaptive_planner.py
          tests/test_adaptive_change_detection.py
          tests/test_operations_calendar.py
          tests/test_adaptive_executor.py
      - name: Import adaptive ASGI entry point
        run: >-
          poetry run python -c
          "from model_informed_greenhouse_dashboard.backend.app.adaptive_main import app;
          assert any(getattr(r, 'path', '') == '/api/advisor/adaptive/execute' for r in app.routes)"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Quality profile component test
        run: >-
          npm test --prefix frontend --
          src/components/advisor/AdvisorQualityProfilePanel.test.tsx
      - run: npm run build --prefix frontend
