name: apply-adaptive-hardening-v4

on:
  push:
    branches:
      - "feat/adaptive-advisor-graph-v1"
    paths:
      - ".github/adaptive_hardening_parts/**"
      - ".github/workflows/apply-adaptive-hardening-v4.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply verified bundle
        shell: bash
        run: |
          set -euo pipefail
          test -d .github/adaptive_hardening_parts
          cat $(find .github/adaptive_hardening_parts -type f -name 'part*' | sort) \
            | base64 --decode > /tmp/adaptive_hardening.tar.gz
          echo "161e8a5ddbcb679c5213c855826dd25f75d2042a92e7fb9793d98572edc74bb9  /tmp/adaptive_hardening.tar.gz" | sha256sum --check
          tar -xzf /tmp/adaptive_hardening.tar.gz -C .
          python apply_adaptive_hardening.py
          python - <<'PY'
          from pathlib import Path

          calibration = Path("tests/test_quality_calibration.py")
          text = calibration.read_text(encoding="utf-8")
          old = 'f"cal-{index:03d}"'
          new = 'f"cal-{index:04d}"'
          if text.count(old) != 1:
              raise RuntimeError("quality calibration run id fixture drifted")
          calibration.write_text(text.replace(old, new, 1), encoding="utf-8")

          quality = Path(
              "src/model_informed_greenhouse_dashboard/backend/app/services/"
              "adaptive_advisor/quality.py"
          )
          text = quality.read_text(encoding="utf-8")
          old = '''    if constraint_gate.status is ConstraintStatus.FAIL:
              answer_status = AnswerStatus.REFUSED
          elif current_coverage < 0.4:
              answer_status = AnswerStatus.NEEDS_DATA
          '''
          new = '''    if constraint_gate.status is ConstraintStatus.FAIL:
              answer_status = AnswerStatus.REFUSED
          elif snapshot_resolution.get("primary_source") == "unavailable":
              answer_status = AnswerStatus.NEEDS_DATA
          elif current_coverage < 0.4:
              answer_status = AnswerStatus.NEEDS_DATA
          '''
          if text.count(old) != 1:
              raise RuntimeError("quality unavailable-snapshot status block drifted")
          quality.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm -f apply_adaptive_hardening.py
          rm -rf .github/adaptive_hardening_parts
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - uses: snok/install-poetry@v1
        with:
          version: "2.1.3"
          virtualenvs-in-project: true

      - run: poetry install

      - name: Adaptive backend hardening suite
        run: >-
          poetry run pytest -q
          tests/test_adaptive_planner.py
          tests/test_adaptive_change_detection.py
          tests/test_operations_calendar.py
          tests/test_server_telemetry_store.py
          tests/test_adaptive_snapshot_resolution.py
          tests/test_adaptive_conversation_store.py
          tests/test_adaptive_numeric_claims.py
          tests/test_runtime_lane_cache.py
          tests/test_market_supply_shock.py
          tests/test_market_supply_shock_guardrails.py
          tests/test_routing_regression.py
          tests/test_routing_regression_guardrails.py
          tests/test_quality_calibration.py
          tests/test_adaptive_executor.py
          tests/test_adaptive_runtime_hardening.py

      - name: Compile adaptive backend
        run: >-
          poetry run python -m compileall -q
          src/model_informed_greenhouse_dashboard/backend/app/services/adaptive_advisor
          src/model_informed_greenhouse_dashboard/backend/app/adaptive_main.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --prefix frontend

      - name: Adaptive frontend tests
        run: >-
          npm test --prefix frontend --
          src/components/advisor/AdvisorQualityProfilePanel.test.tsx
          src/utils/adaptiveHistory.test.ts

      - run: npm run build --prefix frontend

      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(advisor): harden adaptive quality and runtime"
          git push origin "HEAD:${GITHUB_REF_NAME}"
